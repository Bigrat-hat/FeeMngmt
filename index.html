<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Instant Disable Zoom & Native Viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Anshu Coaching Classes - Fee Management Portal</title>
  <meta name="description" content="Anshu Coaching Classes VIP Fees Management System.">

  <!-- PWA Manifest & Instant Launch Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#06271A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Anshu Coaching">

  <!-- High-Res Native App Icons -->
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Chart.js for analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Custom Ultra Premium Stylesheet -->
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <div class="outer-wrapper">
    <!-- Flexible Adaptable Mobile Viewport -->
    <div class="app-viewport">

      <!-- ULTRA PREMIUM ANIMATED EMBLEM SPLASH SCREEN -->
      <div id="appSplashScreen" class="vip-splash-screen">
        <div class="splash-logo-wrapper">
          <img src="logo.png" class="splash-logo-img" alt="Anshu Coaching Emblem Logo" />
        </div>
        <div class="splash-title-box">
          <h1 class="splash-app-title">Anshu Coaching Classes</h1>
          <div class="splash-app-subtitle">VIP Fee Management Portal ✨</div>
        </div>
        <div class="splash-loader-bar-bg">
          <div class="splash-loader-bar-fill"></div>
        </div>
      </div>

      <!-- Header Bar (With Live Date Badge, VIP Long-Press Logo Feature, + Student & Exit Button) -->
      <header class="app-header">
        <div class="brand-badge clickable-card" 
             onmousedown="handleLogoPressStart()" 
             onmouseup="handleLogoPressEnd()" 
             onmouseleave="handleLogoPressEnd()" 
             ontouchstart="handleLogoPressStart()" 
             ontouchend="handleLogoPressEnd()" 
             onclick="handleLogoClick()"
             title="Hold for VIP Executive Suite">
          <img src="logo.png" class="brand-logo-img" alt="Anshu Coaching Emblem" />
          <div>
            <h1 class="brand-title">Anshu Coaching Classes</h1>
            <div class="brand-subtitle">
              <span>VIP Portal ✨</span>
              <span id="liveHeaderDateBadge" class="live-date-header-badge">📅 Today</span>
            </div>
          </div>
        </div>
        <div class="header-actions" style="display:flex; gap:6px;">
          <button class="btn-secondary" style="padding:6px 10px; font-size:10px;" onclick="openModal('add-student')">+ Student</button>
          <button class="btn-secondary" style="padding:6px 8px; font-size:10px; color:var(--status-overdue-text); border-color:var(--status-overdue-border);" onclick="handleAdminLogout()">🚪 Exit</button>
        </div>
      </header>

      <!-- Scrollable Inner Viewport Container -->
      <main id="tab-content" class="scrollable-content"></main>

      <!-- Centered 4-Tab Fixed Bottom Navigation Bar -->
      <nav class="fixed-bottom-nav">
        <button class="nav-item active" onclick="switchTab('dashboard')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/></svg>
          Dashboard
        </button>
        <button class="nav-item" onclick="switchTab('students')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Students
        </button>
        <button class="nav-item" onclick="switchTab('collect')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
          Collect
        </button>
        <button class="nav-item" onclick="switchTab('calendar')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Calendar
        </button>
      </nav>

    </div>
  </div>

  <!-- Global Modal & Bottom Sheet Container -->
  <div id="modal-container"></div>

  <!-- Core Financial Engine & UI Application Script -->
  <script type="module" src="app.js"></script>

</body>
</html>
